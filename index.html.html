<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shruti &amp; Arpit | Save the Date</title>
<meta name="description" content="Shruti and Arpit are getting married on 12 March 2027 at Regenta, Chakkar, Shimla.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
  :root {
    --maroon: #4A1220;
    --maroon-deep: #360D18;
    --gold: #C8A45A;
    --gold-soft: #A88A48;
    --ivory: #F6EBD9;
    --ivory-muted: #D9C7A8;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans: "Jost", "Helvetica Neue", Arial, sans-serif;
    --deva: "Tiro Devanagari Hindi", "Noto Serif Devanagari", serif;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }

  body {
    margin: 0;
    background: var(--maroon-deep);
    background-image: radial-gradient(ellipse at 50% 0%, #5E1A2B 0%, var(--maroon) 45%, var(--maroon-deep) 100%);
    background-attachment: fixed;
    color: var(--ivory);
    font-family: var(--sans);
    font-weight: 300;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 32px 20px 56px;
  }

  /* ---------- Arch ---------- */
  .arch {
    position: relative;
    padding: 132px 28px 64px;
    text-align: center;
  }
  .arch svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .arch path {
    fill: none;
    stroke: var(--gold);
    vector-effect: non-scaling-stroke;
  }
  .arch .outer { stroke-width: 1.5; }
  .arch .inner { stroke-width: 0.75; stroke: var(--gold-soft); }
  .arch .inner, .arch .outer {
    stroke-dasharray: 1;
    stroke-dashoffset: 0;
  }
  @media (prefers-reduced-motion: no-preference) {
    .arch .outer { animation: draw 2.4s ease-out both; }
    .arch .inner { animation: draw 2.4s 0.5s ease-out both; }
    .arch-content { animation: settle 1.6s 1.2s ease-out both; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes settle { from { opacity: 0; } to { opacity: 1; } }
  }

  .arch-content { position: relative; }

  .shubh {
    font-family: var(--deva);
    font-size: 1.35rem;
    color: var(--gold);
    margin: 0 0 6px;
    letter-spacing: 0.02em;
  }
  .std {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.2rem;
    color: var(--ivory-muted);
    margin: 0 0 28px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(3rem, 15vw, 4.4rem);
    line-height: 1;
    margin: 0;
    color: var(--ivory);
  }
  .amp {
    display: block;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 1.8rem;
    color: var(--gold);
    margin: 10px 0 6px;
  }
  .rule {
    width: 56px;
    height: 1px;
    background: var(--gold);
    border: 0;
    margin: 32px auto;
  }
  .date {
    font-family: var(--serif);
    font-size: 1.9rem;
    font-weight: 500;
    margin: 0;
    line-height: 1.2;
  }
  .day {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.15rem;
    color: var(--ivory-muted);
    margin: 4px 0 24px;
  }
  .venue {
    font-size: 1rem;
    margin: 0;
    color: var(--ivory);
    font-weight: 400;
  }
  .venue-sub {
    font-size: 0.95rem;
    margin: 2px 0 0;
    color: var(--ivory-muted);
  }
  .follow {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.1rem;
    color: var(--ivory-muted);
    margin: 32px 0 0;
  }

  .cal {
    display: inline-block;
    margin-top: 20px;
    font-size: 0.9rem;
    color: var(--gold);
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1px;
  }
  .cal:hover { color: var(--ivory); }

  /* ---------- RSVP ---------- */
  .rsvp {
    margin-top: 40px;
    padding: 36px 24px 32px;
    border: 1px solid var(--gold-soft);
    text-align: center;
  }
  .rsvp h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 2rem;
    margin: 0 0 4px;
  }
  .rsvp .lede {
    margin: 0 0 28px;
    color: var(--ivory-muted);
    font-size: 0.95rem;
  }
  .field { text-align: left; margin-bottom: 22px; }
  .field label, .field .legend {
    display: block;
    font-size: 0.9rem;
    color: var(--ivory-muted);
    margin-bottom: 6px;
  }
  input[type="text"], select {
    width: 100%;
    font: inherit;
    font-size: 1.05rem;
    color: var(--ivory);
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--gold-soft);
    border-radius: 0;
    padding: 8px 0;
  }
  select { appearance: none; -webkit-appearance: none; cursor: pointer; }
  select option { color: #222; background: #fff; }
  input[type="text"]::placeholder { color: #a38f78; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice span {
    display: block;
    text-align: center;
    padding: 12px 8px;
    border: 1px solid var(--gold-soft);
    font-size: 0.95rem;
    line-height: 1.3;
    cursor: pointer;
    color: var(--ivory);
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .choice input:checked + span {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--maroon-deep);
    font-weight: 500;
  }
  .choice input:focus-visible + span { outline: 2px solid var(--ivory); outline-offset: 2px; }

  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }

  .send {
    width: 100%;
    font: inherit;
    font-weight: 500;
    font-size: 1.05rem;
    background: var(--gold);
    color: var(--maroon-deep);
    border: 0;
    padding: 14px 16px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .send:hover { background: #D8B76C; }

  .status {
    margin: 16px 0 0;
    font-size: 0.9rem;
    color: var(--ivory-muted);
    min-height: 1.4em;
  }
  .status.error { color: #F2B8A8; }
  .fallback {
    display: none;
    width: 100%;
    margin-top: 10px;
    font: inherit;
    font-size: 0.9rem;
    color: var(--ivory);
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--gold-soft);
    padding: 10px;
    resize: none;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.15rem;
    color: var(--ivory-muted);
  }
</style>
</head>
<body>
<main>

  <section class="arch" aria-label="Save the date">
    <svg viewBox="0 0 400 600" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <path class="outer" pathLength="1" d="M4 596 V250 C4 150 110 110 200 4 C290 110 396 150 396 250 V596 Z"/>
      <path class="inner" pathLength="1" d="M18 596 V254 C18 164 118 126 200 32 C282 126 382 164 382 254 V596 Z"/>
    </svg>

    <div class="arch-content">
      <p class="shubh" lang="hi">शुभ विवाह</p>
      <p class="std">Save the date</p>

      <h1>Shruti<span class="amp">&amp;</span>Arpit</h1>

      <hr class="rule">

      <p class="date">12 March 2027</p>
      <p class="day">Friday</p>

      <p class="venue">Regenta</p>
      <p class="venue-sub">Chakkar, Shimla</p>

      <p class="follow">Formal invitation to follow</p>

      <a class="cal" target="_blank" rel="noopener"
         href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Shruti%20%26%20Arpit%27s%20Wedding&dates=20270312/20270313&location=Regenta%2C%20Chakkar%2C%20Shimla&details=Save%20the%20date%20for%20Shruti%20and%20Arpit%27s%20wedding.%20Formal%20invitation%20to%20follow.">Add to your calendar</a>
    </div>
  </section>

  <section class="rsvp" aria-labelledby="rsvp-title">
    <h2 id="rsvp-title">RSVP</h2>
    <p class="lede">Let us know if you can join us.</p>

    <div class="field">
      <label for="name">Your name</label>
      <input type="text" id="name" autocomplete="name" placeholder="Full name">
    </div>

    <div class="field">
      <span class="legend" id="attend-legend">Will you be attending?</span>
      <div class="choices" role="radiogroup" aria-labelledby="attend-legend">
        <label class="choice">
          <input type="radio" name="attend" value="yes" checked>
          <span>Joyfully accept</span>
        </label>
        <label class="choice">
          <input type="radio" name="attend" value="no">
          <span>Regretfully decline</span>
        </label>
      </div>
    </div>

    <div class="field" id="guests-field">
      <label for="guests">Number of guests, including you</label>
      <select id="guests">
        <option>1</option><option selected>2</option><option>3</option>
        <option>4</option><option>5</option><option>6</option>
      </select>
    </div>

    <button type="button" class="send" id="send">Send RSVP</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <textarea class="fallback" id="fallback" rows="4" readonly aria-label="Your RSVP message"></textarea>
  </section>

  <footer>With love and blessings</footer>

</main>

<script>
  // Add the couple's WhatsApp number here with country code, digits only (e.g. "919876543210").
  // While empty, RSVPs open the phone's share sheet so guests can send the message to the couple.
  var RSVP_WHATSAPP = "";

  var nameEl = document.getElementById("name");
  var guestsEl = document.getElementById("guests");
  var guestsField = document.getElementById("guests-field");
  var statusEl = document.getElementById("status");
  var fallbackEl = document.getElementById("fallback");

  function attending() {
    return document.querySelector('input[name="attend"]:checked').value === "yes";
  }

  document.querySelectorAll('input[name="attend"]').forEach(function (r) {
    r.addEventListener("change", function () {
      guestsField.style.display = attending() ? "" : "none";
    });
  });

  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.className = "status" + (isError ? " error" : "");
  }

  function buildMessage() {
    var name = nameEl.value.trim();
    var base = "Shruti & Arpit's wedding, 12 March 2027, Regenta, Chakkar, Shimla";
    if (attending()) {
      var n = guestsEl.value;
      return "Hello! This is " + name + ". We are happy to confirm our RSVP for " + base +
        ". Number of guests: " + n + ".";
    }
    return "Hello! This is " + name + ". Sadly I won't be able to attend " + base +
      ", but I'm sending my love and best wishes.";
  }

  function showFallback(msg) {
    fallbackEl.style.display = "block";
    fallbackEl.value = msg;
    fallbackEl.focus();
    fallbackEl.select();
    setStatus("Copy this message and send it to Shruti or Arpit.", false);
  }

  document.getElementById("send").addEventListener("click", function () {
    if (!nameEl.value.trim()) {
      setStatus("Please enter your name.", true);
      nameEl.focus();
      return;
    }
    var msg = buildMessage();

    if (RSVP_WHATSAPP) {
      window.open("https://wa.me/" + RSVP_WHATSAPP + "?text=" + encodeURIComponent(msg), "_blank", "noopener");
      setStatus("WhatsApp is opening. Press send there to finish your RSVP.", false);
      return;
    }

    if (navigator.share) {
      navigator.share({ text: msg }).then(function () {
        setStatus("Thank you. We can't wait to celebrate with you.", false);
      }).catch(function (err) {
        if (err && err.name === "AbortError") { setStatus("", false); return; }
        showFallback(msg);
      });
      return;
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(msg).then(function () {
        setStatus("Message copied. Please paste and send it to Shruti or Arpit.", false);
      }).catch(function () { showFallback(msg); });
    } else {
      showFallback(msg);
    }
  });
</script>
</body>
</html>
